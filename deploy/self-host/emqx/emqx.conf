# EMQX 5.x — single JWT (HMAC/HS256) authenticator keyed by JWT_SECRET.
# The shared secret is injected via the EMQX_AUTHENTICATION__... env in compose;
# this file pins listeners and the auth mechanism shape.

node {
  name = "emqx@127.0.0.1"
  # Erlang distribution cookie, NOT a container or network name — it only has to
  # stay stable, and it is deliberately left on the rebranded value the running
  # node already booted with. Changing it is hazardous in a way the name-shaped
  # strings elsewhere in this directory are not: `docker compose up -d` does not
  # restart a container just because a bind-mounted file changed, so the node
  # keeps the old cookie while `emqx ctl` — the healthcheck — reads the new one
  # from this file, fails Erlang distribution auth, and the container goes
  # unhealthy until someone restarts it by hand.
  cookie = "teamclu-self-host"
  # required by EMQX 5.x; mounting our own emqx.conf over the image default drops it
  data_dir = "/opt/emqx/data"
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket.mqtt_path = "/mqtt"
}

# MQTT over TLS, for the mobile apps' native MQTT clients (HiveMQ on Android,
# CocoaMQTT on iOS). They speak raw MQTT, not WebSocket, so Caddy's WSS on 443
# does not serve them — `parseNativeUrl` in apps/expo maps a `wss://` broker URL
# to port 8883.
#
# This was previously disabled with the note "on a 2GiB Podman VM the extra
# listeners push EMQX into OOM". That constraint no longer holds: the box now
# has 7.1GiB and EMQX sits at ~340MiB (<5%), with no OOM kills and no restarts.
#
# ⚠️ THE CERTIFICATE IS CADDY'S, AND EMQX ONLY READS IT AT LISTENER START.
#
# Reusing Caddy's Let's Encrypt cert avoids running a second ACME client, but
# Caddy renews roughly every 60 days and EMQX keeps serving the copy it loaded
# at boot. A renewed cert therefore does NOT reach this listener until EMQX is
# restarted — after which 8883 starts presenting an EXPIRED certificate while
# 443/WSS stays perfectly healthy. Native clients fail TLS verification; nothing
# alerts; Caddy's own view of the cert looks fine, so the obvious place to look
# is the wrong one.
#
# Restarting EMQX periodically is what keeps this listener working. That is a
# deliberate operational choice made when this was enabled, not an oversight.
listeners.ssl.default {
  enable = true
  bind = "0.0.0.0:8883"
  ssl_options {
    # `caddy_data` is mounted read-only at /caddy-certs (see docker-compose.yml).
    #
    # Both paths are OVERRIDDEN at runtime by
    # EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__{CERTFILE,KEYFILE} in
    # docker-compose.yml, which builds them from ${MQTT_DOMAIN} so a renamed
    # host moves the listener to the new certificate in the same step. The
    # values here are only the fallback for running EMQX with this file alone.
    #
    # KNOWN BROKEN as of 2026-08-09, and not caused by the path: Caddy stores
    # certificates 0700 root:root, while this container runs as uid 1000, so
    # EMQX cannot read either file. The listener binds and then drops every
    # connection at handshake with no peer certificate. Verified by reading the
    # files as uid 1000 — the pre-rename path failed identically, so this is not
    # a regression from the rename. Nothing depends on 8883 today: clients get
    # mqtt://…:1883 from /v1/config/bootstrap and iOS ships mqttUseTls false,
    # which is why it went unnoticed. Fixing it needs the certificate copied
    # somewhere readable, not a path change.
    certfile = "/caddy-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mqtt.teamclu-dev.ucar.cc/mqtt.teamclu-dev.ucar.cc.crt"
    keyfile = "/caddy-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mqtt.teamclu-dev.ucar.cc/mqtt.teamclu-dev.ucar.cc.key"
  }
}

listeners.wss.default {
  enable = false
}

dashboard.listeners.http.bind = 18083

authentication = [
  {
    mechanism = jwt
    use_jwks = false
    algorithm = "hmac-based"
    # NOTE: EMQX 5.10+ does NOT interpolate ${VAR} inside this file, so the real
    # secret is injected at runtime via EMQX_AUTHENTICATION__1__SECRET in
    # docker-compose.yml (Compose interpolates it at parse time). This literal is
    # only a placeholder and is overridden by that env var.
    secret = "${EMQX_JWT_SECRET}"
    secret_base64_encoded = true
    # accept the JWT from the MQTT password field
    from = password
    verify_claims = []
  }
]
