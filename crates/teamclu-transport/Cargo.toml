[package]
name = "teamclu-transport"
version = "0.1.0"
edition = "2021"

[dependencies]
rumqttc = "0.24"
# MQTT root store (src/tls.rs). Must be the rustls that rumqttc 0.24 links
# through tokio-rustls 0.25 — its `TlsConfiguration::Rustls` carries that exact
# version's `ClientConfig`.
rustls = "0.22"
rustls-native-certs = "0.7"
webpki-roots = "0.26"
async-nats = "0.49"
async-trait = "0.1"
futures-util = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
