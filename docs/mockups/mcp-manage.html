<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCP 管理 · 效果图</title>
  <style>
    :root {
      --background: #fbfaf7;
      --paper: #ffffff;
      --panel: #efece4;
      --selected: #e7e2d6;
      --foreground: #1a1a14;
      --ink-2: #3d3c34;
      --muted: #75736a;
      --faint: #a8a6a0;
      --border: rgba(26, 26, 20, 0.08);
      --border-soft: rgba(26, 26, 20, 0.05);
      --coral: #e85a4a;
      --ok: #2eb872;
      --warn: #c47a1a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "PingFang SC", "Noto Sans SC", -apple-system, sans-serif;
      background: var(--background);
      color: var(--foreground);
      display: flex;
      min-height: 100%;
    }
    button { font-family: inherit; cursor: pointer; }
    .mono { font-family: "JetBrains Mono", "SF Mono", ui-monospace, monospace; }

    /* 左栏 */
    .nav {
      width: 176px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav .brand {
      font-size: 11px;
      color: var(--faint);
      padding: 4px 9px 12px;
      letter-spacing: 0.04em;
    }
    .nav a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--ink-2);
      text-decoration: none;
    }
    .nav a.active { background: var(--selected); color: var(--foreground); font-weight: 600; }

    /* 中栏列表 */
    .list {
      width: 280px;
      background: var(--background);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .list-head {
      display: flex;
      align-items: center;
      padding: 14px 16px 10px;
      gap: 8px;
    }
    .list-head h1 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; }
    .count {
      font-size: 11px;
      font-family: inherit;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
    }
    .add {
      width: 28px; height: 28px; border: 1px solid var(--border);
      background: var(--paper); border-radius: 7px; color: var(--ink-2); font-size: 16px; line-height: 1;
    }
    .search {
      margin: 0 12px 10px;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--paper);
      font-size: 12.5px;
      color: var(--muted);
    }
    .groups { overflow: auto; flex: 1; padding-bottom: 24px; }
    .g-label {
      padding: 14px 16px 6px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--faint);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px 7px 14px;
      margin: 0 8px;
      border-radius: 8px;
      border: none;
      background: transparent;
      width: calc(100% - 16px);
      text-align: left;
      color: inherit;
    }
    .row:hover { background: rgba(26,26,20,0.04); }
    .row.on { background: var(--paper); box-shadow: inset 2px 0 0 var(--coral); }
    .row.dim .title { color: var(--muted); }
    .row .body { min-width: 0; flex: 1; }
    .title { font-size: 13px; font-weight: 600; }
    .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .check { color: var(--muted); font-size: 14px; }

    /* 右栏详情 — 单页滚动，无 tab */
    .detail {
      flex: 1;
      background: var(--background);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .d-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--background);
    }
    .icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: #f5d6cf; color: var(--coral);
      display: grid; place-items: center; font-size: 15px; flex-shrink: 0;
    }
    .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
    .d-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
    .badge {
      font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 4px;
      background: var(--panel); color: var(--muted);
    }
    .badge.ok { background: rgba(46,184,114,0.12); color: #1f8a54; }
    .badge.warn { background: rgba(196,122,26,0.12); color: var(--warn); }
    .actions { margin-left: auto; display: flex; gap: 6px; }
    .btn {
      height: 32px; padding: 0 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--paper);
      font-size: 13px; color: var(--ink-2);
    }
    .btn.coral { background: var(--coral); color: #fff; border-color: transparent; font-weight: 600; }
    .btn.ghost { background: transparent; color: var(--muted); }
    .scroll { overflow: auto; padding: 20px 24px 40px; }
    .hint {
      border: 1px solid var(--border); background: rgba(239,236,228,0.5);
      border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--muted); margin-bottom: 20px;
    }
    .desc { font-size: 13.5px; line-height: 1.7; color: var(--ink-2); margin: 0 0 22px; }
    h3 {
      margin: 0 0 6px; font-size: 12px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint);
    }
    .info { margin-bottom: 22px; }
    .ir {
      display: flex; gap: 16px; padding: 10px 0;
      border-bottom: 1px solid var(--border-soft); font-size: 13px;
    }
    .ir .k { width: 112px; flex-shrink: 0; color: var(--muted); }
    .ir .v { min-width: 0; word-break: break-all; }
    .tool {
      display: flex; align-items: center; gap: 8px;
      border: 1px solid var(--border); background: var(--paper);
      border-radius: 8px; padding: 8px 12px; margin-bottom: 6px;
      font-size: 12.5px; font-weight: 600;
    }
    .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--ok); flex-shrink: 0; }
    .note { font-size: 11.5px; color: var(--faint); margin-top: 8px; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="brand">TeamClu · workspace</div>
    <a>会话</a>
    <a>联系人</a>
    <a class="active">MCP</a>
    <a>环境变量</a>
    <a>知识</a>
    <a>技能</a>
  </nav>

  <aside class="list">
    <div class="list-head">
      <h1>MCP</h1>
      <span class="count mono">· 5</span>
      <button class="add" type="button" title="添加到团队目录">+</button>
    </div>
    <div class="search">搜索服务器…</div>
    <div class="groups" id="groups"></div>
  </aside>

  <main class="detail" id="detail"></main>

  <script>
    const DATA = {
      available: [
        { id: "Test-lixin", kind: "available", sub: "安装后在本机运行" },
        { id: "wg-weather", kind: "available", sub: "安装后在本机运行" },
      ],
      installed: [],
      personal: [
        { id: "weather", kind: "personal", sub: "已连接 · 4 个工具", ok: true },
        { id: "memory", kind: "personal", sub: "已连接 · 9 个工具", ok: true },
        { id: "pmp", kind: "personal", sub: "需要处理", warn: true },
      ],
    };

    const DETAILS = {
      weather: {
        kind: "personal",
        badge: "个人",
        status: "已连接",
        statusClass: "ok",
        cmd: "npx @mariox/weather-mcp-server",
        transport: "stdio",
        tools: ["get_weather", "get_weather_forecast", "get_current_ip_info", "get_weather_by_coordinates"],
        hint: "这条只在本机。云端团队目录里没有同名服务器。卸载只关掉本机进程，不会改团队目录。",
      },
      memory: {
        kind: "personal",
        badge: "个人",
        status: "已连接",
        statusClass: "ok",
        cmd: "npx -y @modelcontextprotocol/server-memory",
        transport: "stdio",
        tools: ["create_entities", "create_relations", "add_observations", "delete_entities", "read_graph"],
        hint: "本机 MCP，不在团队目录。",
      },
      pmp: {
        kind: "personal",
        badge: "个人",
        status: "需要处理",
        statusClass: "warn",
        cmd: "npx pmp-mcp",
        transport: "stdio",
        tools: [],
        error: "401 — 环境变量 PMP_API_TOKEN 未解析",
        hint: "来自本机旧配置。卸载只清本机。",
      },
      "Test-lixin": {
        kind: "available",
        badge: "团队 · 未安装",
        status: "未安装",
        statusClass: "",
        cmd: "npx test-lixin-mcp",
        transport: "stdio",
        desc: "团队目录里的服务器。安装后才会在本机拉起。",
        hint: "对团队可见，但你还没装。安装会记一笔 Cloud install，并写入本机公共清单。",
      },
      "wg-weather": {
        kind: "available",
        badge: "团队 · 未安装",
        status: "未安装",
        statusClass: "",
        cmd: "npx @scope/wg-weather",
        transport: "stdio",
        desc: "团队天气 MCP。",
        hint: "安装后会出现在「团队 · 已安装」。",
      },
    };

    let selected = "weather";

    function renderList() {
      const groups = [
        { key: "available", label: "团队 · 未安装", rows: DATA.available },
        { key: "installed", label: "团队 · 已安装", rows: DATA.installed },
        { key: "personal", label: "个人", rows: DATA.personal },
      ];
      const el = document.getElementById("groups");
      el.innerHTML = groups.map((g) => {
        const rows = g.rows.length
          ? g.rows.map((r) => `
            <button type="button" class="row ${r.id === selected ? "on" : ""} ${r.kind === "available" ? "dim" : ""}" data-id="${r.id}">
              <div class="body">
                <div class="title">${r.id}</div>
                <div class="sub">${r.sub}</div>
              </div>
              ${r.ok ? '<span class="check">✓</span>' : ""}
            </button>`).join("")
          : `<div class="sub" style="padding:4px 16px 8px">暂无</div>`;
        return `<div class="g-label">${g.label} · ${g.rows.length}</div>${rows}`;
      }).join("");
      el.querySelectorAll("[data-id]").forEach((b) => {
        b.onclick = () => { selected = b.dataset.id; renderList(); renderDetail(); };
      });
    }

    function renderDetail() {
      const d = DETAILS[selected];
      const tools = (d.tools || []).map((t) =>
        `<div class="tool"><span class="dot"></span><span class="mono">${t}</span></div>`
      ).join("");

      let actions = "";
      if (d.kind === "available") {
        actions = `<button class="btn coral">安装</button>`;
      } else if (d.kind === "personal") {
        actions = `<button class="btn">卸载</button><button class="btn">重新探测</button>`;
      } else {
        actions = `<button class="btn">卸载</button><button class="btn ghost">编辑</button><button class="btn">重新探测</button>`;
      }

      document.getElementById("detail").innerHTML = `
        <header class="d-head">
          <div class="icon">⌘</div>
          <div style="min-width:0;flex:1">
            <div class="eyebrow">MCP 服务器</div>
            <div class="d-title">
              ${d.id || selected}
              <span class="badge ${d.statusClass}">${d.status}</span>
              <span class="badge">${d.badge}</span>
            </div>
          </div>
          <div class="actions">${actions}</div>
        </header>
        <div class="scroll">
          ${d.hint ? `<div class="hint">${d.hint}</div>` : ""}
          ${d.desc ? `<p class="desc">${d.desc}</p>` : ""}
          <section class="info">
            <h3>连接</h3>
            <div class="ir"><span class="k">传输</span><span class="v">${d.transport}</span></div>
            <div class="ir"><span class="k">命令</span><span class="v mono">${d.cmd}</span></div>
            <div class="ir"><span class="k">范围</span><span class="v">${d.badge}</span></div>
          </section>
          ${d.kind !== "available" ? `
          <section>
            <h3>工具${d.tools?.length ? " · " + d.tools.length : ""}</h3>
            ${d.error ? `<p class="desc" style="color:var(--warn)">${d.error}</p>` : ""}
            ${tools || `<p class="note">还没有工具列表。</p>`}
          </section>` : ""}
        </div>`;
    }

    renderList();
    renderDetail();
  </script>
</body>
</html>
